<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Página Principal</title>

<style>


/* RESET */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


/* LAYOUT FLEX PRINCIPAL */

.layout{
    display:flex;
    min-height:100vh;
    font-family:Arial, sans-serif;
}


/* SIDEBAR IZQUIERDA */

.sidebar{
    width:220px;
    background-color:#be2668;
    padding:20px;
}

.sidebar ul{
    list-style:none;
}

.sidebar li{
    margin-bottom:20px;
}

.sidebar a{
    text-decoration:none;
    color:white;
    font-weight:bold;
}


/* CONTENIDO DERECHO */

.content{
    flex:1;
    padding:20px;
    background-color:#f4f4f4;
}

/* TARJETAS FLEX */

.tarjetbox{
    display:flex;
    flex-wrap:wrap;
    gap:20px;
    margin-top:20px;
}

.tarjet{
    width:300px;
    background:white;
    padding:10px;
    border-radius:8px;
    border:1px solid #be2668;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.tarjet img{
    width:100%;
    height:180px;
    object-fit:cover;
    border-radius:8px;
}

</style>

</head>
<body>

<div class="layout">

    <!-- BARRA LATERAL -->
    <aside class="sidebar">
        <ul>
            <li><a href="index.html">Principal</a></li>
            <li><a href="acerca.html">Acerca de</a></li>
        </ul>
    </aside>

    <!-- CONTENIDO DERECHO -->
    <main class="content">

        <h1>Películas Disney</h1>

        <div class="tarjetbox">

            <div class="tarjet">
                <img src="https://www.galeriemexico.com.mx/wp-content/uploads/2024/07/disney-plus-catalogo-peliculas-disney-1552044329-2-1024x640-1.jpg">
                <h3>Tarjeta 1</h3>
                <p>Contenido de la tarjeta 1.</p>
            </div>

            <div class="tarjet">
                <img src="https://www.galeriemexico.com.mx/wp-content/uploads/2024/06/descarga-4.jpeg">
                <h3>Tarjeta 2</h3>
                <p>Contenido de la tarjeta 2.</p>
            </div>

            <div class="tarjet">
                <img src="https://images.milenio.com/NKdHIXSTWbWprFXXnyOXZRdIKnQ=/942x532/uploads/media/2019/05/30/up-cumple-diez-anos-pixar.jpg">
                <h3>Tarjeta 3</h3>
                <p>Contenido de la tarjeta 3.</p>
            </div>

            <div class="tarjet">
                <img src="https://alfabetajuega.com/hero/2024/09/estas-son-algunas-de-las-mejores-peliculas-animadas-de-disney-de-los-2000.jpg?width=1200&aspect_ratio=16:9">
                <h3>Tarjeta 4</h3>
                <p>Contenido de la tarjeta 4.</p>
            </div>

            <div class="tarjet">
                <img src="https://cdn.alfabetajuega.com/alfabetajuega/2024/09/una-bonita-secuela-de-esta-querida-pelicula.jpg?width=1200">
                <h3>Tarjeta 5</h3>
                <p>Contenido de la tarjeta 5.</p>
            </div>

            <div class="tarjet">
                <img src="https://media.gq.com.mx/photos/5f4692f9ef6115112e88bd10/master/pass/PinochoDisney.jpg">
                <h3>Tarjeta 6</h3>
                <p>Contenido de la tarjeta 6.</p>
            </div>

        </div>

    </main>

</div>

</body>
</html>
